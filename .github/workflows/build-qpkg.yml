name: Build QNAP QPKG

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:
    inputs:
      allow_llama_rebuild:
        description: "Rebuild pinned llama.cpp only if runtime cache/baseline is unavailable"
        required: false
        default: false
        type: boolean

concurrency:
  group: qpkg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  LLAMA_CPP_COMMIT: 6d05498314db1b57f81c271080018aa2d0b89be9
  QDK_COMMIT: 78c77b898fecba8f860b630177248b5fa3f5baaf
  BASELINE_QPKG_RUN: "32223913831"
  RUNTIME_CACHE_VERSION: "ts253be-sse42-static-v1"
  SHERPA_ONNX_VERSION: "1.13.4"
  SHERPA_GO_LINUX_COMMIT: "a424c836679c18e71d7afcab293ea5ecf539044f"
  SHERPA_CACHE_VERSION: "ts253be-static-v1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel obsolete QPKG runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" --jq '.workflow_runs[] | select(.name == "Build QNAP QPKG" and (.status == "queued" or .status == "in_progress")) | .id'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Cancelling obsolete QPKG run $run_id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            fi
          done

      - name: Restore pinned llama runtime
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: |
            x86_64/bin/llama-server
            x86_64/bin/llama-bench
          key: llama-${{ env.RUNTIME_CACHE_VERSION }}-${{ env.LLAMA_CPP_COMMIT }}

      - name: Reuse verified llama runtime from baseline QPKG
        if: steps.llama-cache.outputs.cache-hit != 'true'
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .bootstrap
          mkdir -p .bootstrap
          gh run download "$BASELINE_QPKG_RUN" -n QnapAssistant-x86_64 -D .bootstrap
          ./scripts/bootstrap-llama-from-qpkg.sh .bootstrap

      - name: Rebuild llama runtime only when explicitly allowed
        if: steps.llama-cache.outputs.cache-hit != 'true' && steps.baseline.outcome != 'success' && inputs.allow_llama_rebuild == true
        run: |
          docker run --rm -e LLAMA_CPP_COMMIT="$LLAMA_CPP_COMMIT" -v "$PWD:/work" -w /work alpine:3.22 \
            sh -lc 'apk add --no-cache bash build-base cmake ninja git linux-headers file && ./scripts/build-llama.sh'

      - name: Refuse unexpected expensive llama rebuild
        if: steps.llama-cache.outputs.cache-hit != 'true' && steps.baseline.outcome != 'success' && inputs.allow_llama_rebuild != true
        run: |
          echo "Pinned llama runtime cache/baseline unavailable; refusing automatic expensive rebuild." >&2
          exit 1

      - name: Restore sherpa static dependencies
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: .voice-deps
          key: sherpa-${{ env.SHERPA_CACHE_VERSION }}-${{ env.SHERPA_ONNX_VERSION }}-${{ env.SHERPA_GO_LINUX_COMMIT }}

      - name: Build lightweight management API
        run: |
          mkdir -p x86_64/bin
          cd admin
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ../x86_64/bin/qnap-assistant .

      - name: Build static ASR/TTS voice worker
        run: ./scripts/build-voice-worker.sh

      - name: Validate sources and runtime compatibility
        run: |
          ./scripts/validate.sh
          strip x86_64/bin/llama-server x86_64/bin/llama-bench || true
          file x86_64/bin/qnap-assistant x86_64/bin/qnap-voice-worker x86_64/bin/llama-server x86_64/bin/llama-bench
          if ldd x86_64/bin/llama-server 2>&1 | grep -vqE 'not a dynamic executable|statically linked'; then
            echo "llama-server is unexpectedly dynamically linked" >&2
            exit 1
          fi
          if ldd x86_64/bin/qnap-voice-worker 2>&1 | grep -vqE 'not a dynamic executable|statically linked'; then
            echo "qnap-voice-worker is unexpectedly dynamically linked" >&2
            exit 1
          fi
          if objdump -d x86_64/bin/llama-server | grep -E '\b(ymm[0-9]+|zmm[0-9]+)\b' -m 1; then
            echo "Unexpected AVX/AVX-512 vector register detected in llama-server" >&2
            exit 1
          fi

      - name: Build QPKG
        run: ./scripts/build-qpkg.sh

      - name: Upload QPKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: QnapAssistant-x86_64
          path: |
            dist/*.qpkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.qpkg dist/*.sha256 --clobber
